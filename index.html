<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapForMoney</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="upgrades.css">
    <link rel="shortcut icon" href="images/iconMoney.png" type="image/x-icon">
</head>
<body>
    <div class="container1">
            <!--UPGRADES-->
         <button onclick="toggleMenu()" id="upgrades">UPGRADES</button>

            <!-- Counter-->
         <div class="circle">
             <div id="counter">0</div>
         </div>
    </div>
     
    <div class="container2">
             <!--Button for tap-->
        <div class="taptobutton">
            <button onclick="" id="button">TAP</button>
        </div>
                <!--Your balance-->
        <div id="balance">TAP FOR MONEY</div>
    </div>

            <!--upgrade menu-->
     <div id="upgradeMenu" class="upgradeDrawer">
            <!--EXIT to menu-->
        <button class="closebutton" onclick="toggleMenu()"><img src="images/exit.png" class="exit" alt=""></button>
            <!--Principal content-->
        <h2>UPGRADES</h2>
        
        
        <div class="containerUpgrades">
            <div class="case">
                <p>TAP -> $0.20</p>
                <p class="valuePurchase">$3.00</p>
                <button id="money1"
                class="butcase">PURCHASE</button>
            </div>
            
            <div class="case hidden" id="up2">
                <p>TAP -> $0.50</p>
                <p class="valuePurchase">$30.00</p>
                <button id="money2"
                class="butcase">PURCHASE</button>
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
    <script src="upgrade.js" defer></script>
</body>
</html>
